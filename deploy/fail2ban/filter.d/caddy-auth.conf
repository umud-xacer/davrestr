# Caddy JSON access logini (./caddy-logs/access.log) o'qiydi. Caddyfile'da
# global `trusted_proxies`/`client_ip_headers` sozlangani uchun har bir yozuvda
# haqiqiy tashrif buyuruvchi IP "client_ip" maydonida keladi (Cloudflare edge
# IP'i emas) — shuning uchun <HOST> shu maydondan olinadi.
#
# Ikki holatni kuzatadi:
#   1) /api/v1/auth/login yoki /refresh'ga muvaffaqiyatsiz (401) urinishlar —
#      parol/token bilan qo'pol kuch (brute-force) hujumi belgisi.
#   2) Har qanday endpoint'da 429 (rate-limit ishga tushgani) — bu allaqachon
#      app/core/rate_limit.py shubhali deb belgilagan trafik.
[Definition]
failregex = "client_ip":"<HOST>".*"uri":"/api/v1/auth/(login|refresh)".*"status":401
            "client_ip":"<HOST>".*"status":429
ignoreregex =
