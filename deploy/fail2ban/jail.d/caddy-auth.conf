# /root/davreestr'ni DEPLOY.md 3-qadamda tanlangan haqiqiy clone yo'liga
# moslang (bu backup cron qatoridagi yo'l bilan bir xil bo'lishi kerak).
# `action = ufw` DEPLOY.md 9-bo'limida yoqilgan ufw bilan ishlaydi — fail2ban
# shu orqali IP'ni ufw qoidalariga bloklaydi.
[caddy-auth]
enabled = true
filter = caddy-auth
logpath = /root/davreestr/caddy-logs/access.log
maxretry = 15
findtime = 300
bantime = 3600
action = ufw
